# ─────────────────────────────────────────────────────────────
# Campgrounds — documentation site configuration
#
# The mod's UniqueID (PeacefulEnd.Campgrounds) and the repository
# (github.com/Floogen/Campgrounds) are confirmed.
# ─────────────────────────────────────────────────────────────
# ─────────────────────────────────────────────────────────────

site_name: Campgrounds
site_description: Documentation for the Campgrounds framework for Stardew Valley.
site_author: Floogen
site_url: https://floogen.github.io/Campgrounds/

repo_url: https://github.com/Floogen/Campgrounds
repo_name: Source
edit_uri: edit/main/docs/

copyright: Campgrounds is a framework mod for Stardew Valley.

theme:
  name: material
  language: en
  icon:
    repo: fontawesome/brands/github
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.sections
    - navigation.expand
    - navigation.top
    - toc.follow
    - search.suggest
    - search.highlight
    - search.share
    - content.code.copy
    - content.code.annotate
    - content.action.edit
    - content.tabs.link
  # Dark is the default. The first entry wins on first visit; the toggle switches
  # between the two and Material remembers the choice in local storage.
  # No prefers-color-scheme media queries here — those would hand the default
  # back to the visitor's OS setting.
  palette:
    - scheme: slate
      primary: green
      accent: deep orange
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
    - scheme: default
      primary: green
      accent: deep orange
      toggle:
        icon: material/weather-night
        name: Switch to dark mode

extra_css:
  - stylesheets/extra.css

markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
      toc_depth: 3
  - pymdownx.betterem
  - pymdownx.caret
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.mark
  - pymdownx.smartsymbols
  - pymdownx.snippets
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.tilde

plugins:
  - search

# Fail the build on broken cross-references rather than shipping them.
validation:
  omitted_files: warn
  absolute_links: warn
  unrecognized_links: warn
  anchors: warn

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/Floogen
      name: Floogen on GitHub

nav:
  - Home: index.md
  - Getting Started:
      - Overview: getting-started/index.md
      - Data Assets: getting-started/data-assets.md
      - JSON Conventions: getting-started/json-conventions.md
      - A Complete Example: getting-started/complete-example.md
  - Content Packs:
      - Overview: content-packs/index.md
      - Campgrounds: content-packs/campgrounds.md
      - Tents: content-packs/tents.md
      - Campfire Foods: content-packs/campfire-foods.md
      - Villagers: content-packs/villagers.md
      - Visitors: content-packs/visitors.md
  - Reference:
      - Overview: reference/index.md
      - Shared Models: reference/shared-models.md
      - Enums: reference/enums.md
      - Framework Reference: reference/framework.md
